version: '3.8'

services:
  redis:
    image: docker.m.daocloud.io/library/redis:6.2.19
    container_name: abstergo_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    volumes:
      - ~/docker/abstergo/redis:/data
    restart: always

  rabbitmq:
    image: docker.m.daocloud.io/library/rabbitmq:3-management
    container_name: abstergo_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - ~/docker/abstergo/rabbitmq:/var/lib/rabbitmq
    restart: always

  zookeeper:
    image: docker.m.daocloud.io/library/zookeeper:latest
    container_name: abstergo_zookeeper
    ports:
      - "2181:2181"
      - "2888:2888"
      - "3888:3888"
      - "8989:8080"
    volumes:
      - ~/docker/abstergo/zookeeper/data:/data
      - ~/docker/abstergo/zookeeper/datalog:/datalog
    restart: always