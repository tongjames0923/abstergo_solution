# MQ模块国际化资源

# 失败消息存储校验
mq.failed.message.required=失败消息记录不能为空
mq.failed.message.id.required=失败消息记录缺少唯一标识
mq.failed.message.next.retry.time.required=失败消息记录缺少下次重试时间, id:{0}

# 重试延迟策略
mq.retry.delay.steps.required=重试延迟档位不能为空

# 重试处理器
mq.retry.max.count.invalid=最大重试次数不能为负数
# 重投递
mq.republisher.failed.store.required=重投递需要失败消息存储
mq.republisher.delay.policy.required=重投递需要重试延迟策略

# v2 记录驱动消费模型 · 接收与分发校验
mq.v2.consume.no.consumer=消息负载类型[{0}]未注册任何消费者，消息留FAILED待注册后回灌
mq.v2.message.vo.required=消息VO不能为空
mq.v2.business.id.required=businessId不能为空，请在子类覆盖resolveBusinessId提供业务标识
