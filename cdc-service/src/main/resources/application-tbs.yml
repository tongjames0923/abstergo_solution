tbs:
  i18n:
    enabled: true
    # basename 会自动通过 IMessageSourceProvider Bean 注册
    encoding: UTF-8
    default-locale: zh_CN
    cache-seconds: 3600
    use-code-as-default-message: true
  # CDC 数据库变更数据捕获（纯后端能力模块）
  # 总开关默认启用：@EnableTbsCdc 注解引入即生效；如需关闭可配置 enable: false
  cdc:
    # 捕获源由引入的实现子模块（cdc-mysql-impl / cdc-sqlserver-impl）决定，无需声明类型
    # 事件载荷裁剪模式：full / changed-only / key-only
    payload-mode: changed-only
    sqlserver:
      # 独立于主库(MySQL)的连接变量：默认 192.168.80.12:1433，可用 CDC_DB_HOST/CDC_DB_PORT 覆盖
      hostname: ${CDC_DB_HOST:192.168.80.12}
      port: ${CDC_DB_PORT:1433}
      # CDC 专用账号（需对目标库读取及 CDC 元数据访问权限），走环境变量注入
      username: ${CDC_DB_USERNAME:fr}
      password: ${CDC_DB_PASSWORD:XhErp@888}
      # Debezium 逻辑服务名（topic 前缀/源标识），须全局唯一
      server-name: tbs_cdc
      # 捕获的数据库列表，逗号分隔（透传 database.names，SQL Server 连接器必填，无 database.include.list 概念）
      database-include-list: ${CDC_DB_INCLUDE:XH_E10}
      # 捕获的表白名单，逗号分隔【schema.table 格式】（透传table.include.list）；
      # 注意：Debezium 3.0.8 实测匹配的是 schema.table，不带数据库名前缀（写 XH_E10.dbo.PURCHASE_ORDER 不会命中）
      table-include-list: ${CDC_TABLE_INCLUDE:dbo.PURCHASE_ORDER}
      # 消费位点持久化文件：生产建议挂持久卷；删除该文件且 snapshot.mode=initial 会触发全量重新消费
      offset-storage-file: ${CDC_OFFSET_FILE:data/cdc-offsets-sqlserver.dat}
      # 位点重置维护开关：true 时启动前成对删除位点+结构历史文件（全新启动），仅用于二者不一致的故障恢复；
      # 使用后必须置回 false，否则每次重启都会丢弃消费位点
      reset-offset: true
      # 快照模式：schema_only 仅快照表结构后立即进入增量；SQL Server 不支持 never
      snapshot-mode: ${CDC_SNAPSHOT_MODE:schema_only}
      # 连接加密与证书：本地/自签环境常置 false + true（与 JDBC 连接串一致）
      encrypt: false
      trust-server-certificate: true
      # 心跳间隔（毫秒），无变更时产生心跳事件推进位点
      heartbeat-interval-ms: 5000
    filter:
      # 库/表白名单、黑名单，为空表示不限制（include-databases 比对的是库名，非表名）
      include-databases: [ "XH_E10" ]
      exclude-databases: [ ]
      include-table-patterns: [ ]
      exclude-table-patterns: [ ]
      # 行级过滤：key 为 db.table，value 为 SpEL；变量 #beforeData/#afterData/#changeType，返回 false 则丢弃
      row-conditions: { }
      #  例："[app_system.sys_user]": "#afterData['status'] != 'DELETED'"
    batch:
      # 异步分发有界队列容量
      queue-capacity: 10000
      # 单批刷新最大事件数
      batch-size: 200
      # 队列刷新最大间隔（毫秒）
      flush-interval-ms: 500
      # 队列满背压策略：block（阻塞不丢）/ drop-oldest（丢最旧并告警）
      on-full: block
    error:
      # 监听器执行失败重试次数
      retry-times: 3
      # 重试间隔（毫秒）
      retry-delay-ms: 1000
      # 最终失败策略：skip（跳过记日志）/ dead-letter（死信快照）
      on-fail: skip
    # 进程内分发模式（跨服务分发由 tbs.cdc.mq 承担）
    dispatch:
      in-process-mode: async             # sync / async
    # CDC → RabbitMQ 发出配置
    mq:
      # 总开关：false 时不装配 MQ 发出监听器，事件仅进程内分发
      enable: true
      # 目标交换机
      exchange: tbs.cdc
      # 交换机类型：direct / topic / fanout / headers
      exchange-type: topic
      # 交换机与自动声明队列是否持久化
      durable: true
      # 路由键模板，占位符 {database}/{table}/{changeType} 按事件渲染
      routing-pattern: ERP.E10.{table}
      # 启动时自动声明交换机（解决发送侧只发不建导致的 404）
      auto-declare: true
      # 可选：随启动自动声明队列并绑定到交换机（消费者不在本服务时可不配置，由消费侧声明）
      bindings: [ ]
      #  例：
      #  bindings:
      #    - queue: tbs.cdc.all
      #      routing-key: "#"
