spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    generate-ddl: false
    database: mysql
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    # nullCatalogMeansCurrent=true：修正 MySQL 8.x 驱动默认行为——让 JDBC 元数据只扫描当前连接的库，
    # 否则 Hibernate 的 ddl-auto:update 会误把同服务器上其它库（如 core_app）已有的同名表当作“已存在”而跳过建表，
    # 进而对当前库执行 create index 时报 “Table 'xxx.yyy' doesn't exist”
    url: jdbc:p6spy:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:core_app}?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useUnicode=true&allowMultiQueries=true&nullCatalogMeansCurrent=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456789}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # 连接池名称
      pool-name: HikariCP
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接数
      maximum-pool-size: 20
      # 连接超时时间(毫秒)
      connection-timeout: 30000
      # 空闲连接超时时间(毫秒)
      idle-timeout: 600000
      # 连接最大存活时间(毫秒)
      max-lifetime: 1800000
      # 连接测试查询
      connection-test-query: SELECT 1
mybatis:
  configuration:
    map-underscore-to-camel-case: true
