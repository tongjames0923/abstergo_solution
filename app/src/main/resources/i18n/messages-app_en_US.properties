# Value getters (dynamic event condition sources)
value.getter.common.result.name=String value
value.getter.common.result.description=String typed value; returns an empty string when retrieval fails
value.getter.current-user.name=Current User
value.getter.current-user.description=Reads current login session information, including login status, user name, session id, token expiration, token type and token status. Returns an empty string when not logged in or on failure; never exposes the raw token
value.getter.current-user.param.type.name=Information type
value.getter.current-user.param.type.description=Select the current user information type to read
value.getter.current-user.type.logged-in=Logged in (true/false)
value.getter.current-user.type.user-name=User name
value.getter.current-user.type.session-id=Session id
value.getter.current-user.type.expire-time=Token expiration (epoch milliseconds)
value.getter.current-user.type.token-type=Token type (enum name)
value.getter.current-user.type.status=Token status (enum name)
value.getter.date-time.name=Date Time
value.getter.date-time.description=Outputs the current date time by type, including timestamp, date time, date, time, year, month, day, day of week and hour. An optional Java ZoneId is supported; an invalid zone falls back to the system default
value.getter.date-time.param.type.name=Time type
value.getter.date-time.param.type.description=Select the time information type to output
value.getter.date-time.param.zone.name=Time zone
value.getter.date-time.param.zone.description=Java ZoneId, such as Asia/Shanghai or UTC; leave blank for the system default
value.getter.date-time.type.timestamp=Epoch milliseconds
value.getter.date-time.type.datetime=Full date time (yyyy-MM-dd HH:mm:ss)
value.getter.date-time.type.date=Date (yyyy-MM-dd)
value.getter.date-time.type.time=Time (HH:mm:ss)
value.getter.date-time.type.year=Year
value.getter.date-time.type.month=Month (1-12)
value.getter.date-time.type.day=Day of month (1-31)
value.getter.date-time.type.day-of-week=Day of week (1=Monday, 7=Sunday)
value.getter.date-time.type.hour=Hour (0-23)
value.getter.config-property.name=Config Property
value.getter.config-property.description=Reads a Spring property by key. Only allowlisted prefixes and non-sensitive keys are accepted; returns the default value or an empty string when the property is missing or rejected
value.getter.config-property.param.key.name=Property key
value.getter.config-property.param.key.description=Full property key, such as tbs.gateway.enable
value.getter.config-property.param.default.name=Default value
value.getter.config-property.param.default.description=Value returned when the property is missing or rejected; may be blank
value.getter.data-holder.name=Data Holder Variable
value.getter.data-holder.description=Reads a runtime variable from a local or Redis data holder by holder name and key. Read-only; returns an empty string when missing or on failure
value.getter.data-holder.param.holder.name=Holder name
value.getter.data-holder.param.holder.description=Registered IDataHolder name; leave blank for defaultDataHolder
value.getter.data-holder.param.key.name=Variable key
value.getter.data-holder.param.key.description=Key of the variable to read
value.getter.request-context.name=Request Context
value.getter.request-context.description=Reads the trace id or a custom business variable from the current request context. Returns an empty string when no context exists or the variable is missing
value.getter.request-context.param.type.name=Information type
value.getter.request-context.param.type.description=Select a predefined value or a custom context variable
value.getter.request-context.param.key.name=Variable name
value.getter.request-context.param.key.description=Variable name when the type is a custom context variable
value.getter.request-context.type.trace-id=Trace id
value.getter.request-context.type.context-value=Custom context variable
