tbs:
  i18n:
    enabled: true
    # basename 会自动通过 IMessageSourceProvider Bean 注册
    # 如需添加额外的 basename，可在此配置
    # basenames:
    #   - messages-app
    encoding: UTF-8
    default-locale: zh_CN
    cache-seconds: 3600
    use-code-as-default-message: true
  web:
    permit-all-paths:
      - /public/**
      - /doc.html
      - /swagger-ui/**
      - /swagger-resources/**
      - /v3/api-docs/**
      - /webjars/**
    secured-paths:
      - /private/**
    auth:
      enable: true
      token-expire-time: 1800
      token-issuance-center-impl: com.tbs.app.web.DefaultTokenSignCenter
      refresh-token-expire-time: 168
      application-token-expire-time: 168
      third-party-token-expire-time: 3
    enable-cors: true
  system:
    main-delegate-invoker-impl: com.tbs.async.delegate.AsyncDelegateInvoker
    enable: true
    enable-operate-log: true
    remote:
      enable: true
      tree-store-impl: com.tbs.struct.tree.closure.impl.service.ClosureTreeServiceImpl
    enable-api-permission: true
    enable-method-log: true
  cache:
    cache-manager-impl: org.redisson.spring.cache.RedissonSpringCacheManager
    ttl-cache-decorator: com.tbs.cache.redis.RedissonTtlCacheDecorator
    multi-level:
      enabled: true
    ttl:
      # key 必须用 "[...]" 方括号记法：Spring Boot relaxed binding 会移除裸 key 中的 ":"、"_" 等字符
      # key 为业务原始 cacheName（与 CacheNamesConstants 常量取值一致，不含 SYSTEM:CACHE: 前缀，也不含模块前缀）
      overrides:
        "[app:user_name_id_map]": 2h
  broadcast:
    event-bus-type: com.tbs.broadcast.bus.impl.SimpleEventBus
  lock:
    lock-provider-type: com.tbs.lock.redis.RedissonLockProvider
  data:
    data-holder-manager: com.tbs.common.data.impl.DefaultAutoGenDataHolderManager
    data-holder: com.tbs.redis.holder.RedisDataHolder
  redis:
    # 总开关默认启用：@EnableTbsRedis 注解引入即生效；如需关闭可配置 enable: false
  redission:
    cache:
      allow-null-values: true
      max-idle-time: 7200
      cache-timeout: 14400
  start-up:
    optional-execute: false
  xxl-job:
    enable: true
    enable-json-job-executor: true
    config:
      admin-address: ${XXL_JOB_ADMIN_ADDRESS:http://127.0.0.1:9898/xxl-job-admin}
      app-name: mainSystemApplication
      access-token: ${XXL_JOB_ACCESS_TOKEN:123456789}
      log-retentions-days: 3
      log-path: "logs/xxl-job/jobhandler"
  knife4j:
    enable: true
    show-url: true
  oss:
    enable: ${OSS_ENABLE:true}
    type: ${OSS_TYPE:minio}
    endpoint: ${OSS_ENDPOINT:http://127.0.0.1:9000}
    access-key-id: ${OSS_ACCESS_KEY_ID:minioadmin}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:minioadmin}
    default-bucket: ${OSS_DEFAULT_BUCKET:app-files}
    path-style-access: true
    download-code:
      storage: db
  wecom:
    enable: true
    corp-id: ${WECOM_CORP_ID}
    agent-id: ${WECOM_AGENT_ID}
    corp-secret: ${WECOM_CORP_SECRET}
  # 推送模块总开关默认启用：@EnableTbsPush 注解引入即生效；如需关闭可配置 enable: false
  push:
    transport: sse
    heartbeat-timeout-millis: 600000
    dispatch:
      scheduler: job
  common:
    object-provider:
      enable: true
# 应用自定义配置
app:
  # CDC事件MQ消费（消费cdc-service发出的数据库变更事件）
  cdc:
    mq:
      consumer:
        # 总开关：false 时不装配 CDC 事件消费者
        enable: true
        # 消费队列名称
        queue: tbs.cdc.app
        # 目标交换机（与 cdc-service 的 tbs.cdc.mq.exchange 保持一致）
        exchange: tbs.cdc
        # 绑定路由键模式（cdc-service 路由模板为 cdc.{database}.{table}.{changeType}）
        routing-key: cdc.#
        # 消费幂等（按 eventId/messageId 去重，依赖 IIdempotentStore 实现）
        idempotent-enabled: true
