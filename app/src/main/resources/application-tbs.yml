tbs:
  web:
    permit-all-paths:
      - /public/**
    secured-paths:
      - /private/**
    auth:
      enable: true
      token-expire-time: 600
      token-issuance-center-impl: com.tbs.app.web.DefaultTokenSignCenter
    enable-cors: true
  system:
    main-delegate-invoker-impl: com.tbs.async.delegate.AsyncDelegateInvoker
    enable: true
  cache:
    cache-manager-impl: org.redisson.spring.cache.RedissonSpringCacheManager
    ttl-cache-decorator: com.tbs.redis.cache.RedissonTtlCacheDecorator
  boardcast:
    event-bus-type: com.tbs.broadcast.bus.impl.SimpleEventBus
  lock:
    lock-provider-type: com.tbs.redis.lock.RedissonLockProvider
  data:
    data-holder-manager: com.tbs.common.data.impl.DefaultAutoGenDataHodlerManager
    data-holder: com.tbs.redis.holder.RedisDataHolder
  redis:
    enable: true
    value-serializer: org.springframework.data.redis.serializer.GenericJackson2JsonRedisSerializer
  start-up:
    optional-execute: false
