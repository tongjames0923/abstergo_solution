tbs:
  i18n:
    enabled: true
    # basename 会自动通过 IMessageSourceProvider Bean 注册
    # 如需添加额外的 basename，可在此配置
    # basenames:
    #   - messages-app
    encoding: UTF-8
    default-locale: zh_CN
    cache-seconds: 3600
    use-code-as-default-message: true
  web:
    permit-all-paths:
      - /public/**
      - /doc.html
      - /swagger-ui/**
      - /swagger-resources/**
      - /v3/api-docs/**
      - /webjars/**
    secured-paths:
      - /private/**
    auth:
      enable: true
      token-expire-time: 1800
      token-issuance-center-impl: com.tbs.app.web.DefaultTokenSignCenter
      refresh-token-expire-time: 168
      application-token-expire-time: 168
      third-party-token-expire-time: 3
    enable-cors: true
  system:
    main-delegate-invoker-impl: com.tbs.async.delegate.AsyncDelegateInvoker
    enable: true
    enable-operate-log: true
    remote:
      enable: true
      tree-store-impl: com.tbs.struct.tree.closure.impl.service.ClosureTreeServiceImpl
    enable-api-permission: true
    enable-method-log: true
  cache:
    cache-manager-impl: org.redisson.spring.cache.RedissonSpringCacheManager
    ttl-cache-decorator: com.tbs.cache.redis.RedissonTtlCacheDecorator
    multi-level:
      enabled: true
    ttl:
      # key 必须用 "[...]" 方括号记法：Spring Boot relaxed binding 会移除裸 key 中的 ":"、"_" 等字符
      # key 为业务原始 cacheName（与 CacheNamesConstants 常量取值一致，不含 SYSTEM:CACHE: 前缀，也不含模块前缀）
      overrides:
        "[app:user_name_id_map]": 2h
  broadcast:
    event-bus-type: com.tbs.broadcast.bus.impl.SimpleEventBus
  lock:
    lock-provider-type: com.tbs.lock.redis.RedissonLockProvider
  data:
    data-holder-manager: com.tbs.common.data.impl.DefaultAutoGenDataHolderManager
    data-holder: com.tbs.redis.holder.RedisDataHolder
  redis:
    enable: true
  redission:
    cache:
      allow-null-values: true
      max-idle-time: 7200
      cache-timeout: 14400
  start-up:
    optional-execute: false
  xxl-job:
    enable: true
    enable-json-job-executor: true
    config:
      admin-address: ${XXL_JOB_ADMIN_ADDRESS:http://127.0.0.1:9898/xxl-job-admin}
      app-name: mainSystemApplication
      access-token: ${XXL_JOB_ACCESS_TOKEN:123456789}
      log-retentions-days: 3
      log-path: "logs/xxl-job/jobhandler"
  knife4j:
    enable: true
    show-url: true
  mq:
    retry:
      scheduler: job
  oss:
    enable: ${OSS_ENABLE:false}
    type: ${OSS_TYPE:minio}
    endpoint: ${OSS_ENDPOINT:http://127.0.0.1:9000}
    access-key-id: ${OSS_ACCESS_KEY_ID:minioadmin}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:minioadmin}
    default-bucket: ${OSS_DEFAULT_BUCKET:app-files}
    path-style-access: true
    download-code:
      storage: db
  wecom:
    enable: true
    corp-id: ${WECOM_CORP_ID}
    agent-id: ${WECOM_AGENT_ID}
    corp-secret: ${WECOM_CORP_SECRET}
  push:
    transport: sse
    heartbeat-timeout-millis: 600000
    dispatch:
      scheduler: job
    enable: true
  # CDC 数据库变更数据捕获（纯后端能力模块）
  cdc:
    # 模块总开关：false 时零 Bean 装配、零线程占用，对存量应用无影响
    enable: ${CDC_ENABLE:false}
    # 捕获源类型：mysql（postgresql/mongodb 需另引入对应实现子模块）
    source-type: mysql
    # 事件载荷裁剪模式：full / changed-only / key-only
    payload-mode: changed-only
    mysql:
      hostname: ${CDC_DB_HOST:${DB_HOST:127.0.0.1}}
      port: ${CDC_DB_PORT:${DB_PORT:3306}}
      # CDC 专用最小权限账号（仅 REPLICATION SLAVE/CLIENT），走环境变量注入
      username: ${CDC_DB_USERNAME:cdc_user}
      password: ${CDC_DB_PASSWORD:}
      # Debezium 逻辑服务名（topic 前缀/源标识），须全局唯一
      server-name: tbs_cdc
      # MySQL 复制节点 server-id：高危项，须唯一且落在 [2,4294967294]，不得与集群其他复制节点冲突
      server-id: ${CDC_SERVER_ID:184001}
      # 捕获的数据库白名单，逗号分隔（透传 database.include.list）
      database-include-list: ${CDC_DB_INCLUDE:core_app}
      # 捕获的表白名单，逗号分隔，格式 db.table（透传 table.include.list）
      table-include-list: ${CDC_TABLE_INCLUDE:}
      # 消费位点持久化文件：生产建议挂持久卷；删除该文件且 snapshot.mode=initial 会触发全量重新消费
      offset-storage-file: ${CDC_OFFSET_FILE:data/cdc-offsets.dat}
      # 快照模式：never 仅增量；initial 全量快照+增量
      snapshot-mode: never
      # 心跳间隔（毫秒），无变更时产生心跳事件推进位点
      heartbeat-interval-ms: 5000
    filter:
      # 库/表白名单、黑名单，为空表示不限制
      include-databases: []
      exclude-databases: []
      include-table-patterns: []
      exclude-table-patterns: []
      # 行级过滤：key 为 db.table，value 为 SpEL；变量 #beforeData/#afterData/#changeType，返回 false 则丢弃
      row-conditions: {}
      #  例："[core_app.sys_user]": "#afterData['status'] != 'DELETED'"
    dispatch:
      # 分发模式：in-process / mq / both
      mode: in-process
      # 进程内分发线程模式：sync / async
      in-process-mode: async
      mq:
        exchange: tbs.cdc
        routing-pattern: "cdc.{database}.{table}.{changeType}"
    batch:
      # 异步分发有界队列容量
      queue-capacity: 10000
      # 单批刷新最大事件数
      batch-size: 200
      # 队列刷新最大间隔（毫秒）
      flush-interval-ms: 500
      # 队列满背压策略：block（阻塞不丢）/ drop-oldest（丢最旧并告警）
      on-full: block
    error:
      # 监听器执行失败重试次数
      retry-times: 3
      # 重试间隔（毫秒）
      retry-delay-ms: 1000
      # 最终失败策略：skip（跳过记日志）/ dead-letter（死信快照）
      on-fail: skip
