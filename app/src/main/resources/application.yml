# Spring配置
spring:
  profiles:
    include:
      - tbs
      - db
      - redis
      - mq
  application:
    name: app-service
  # Nacos配置中心：从配置中心导入远程配置（optional前缀表示Nacos不可用时仍可本地启动）
  config:
    import:
      - optional:nacos:RABBITMQ.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:CoreAppDb.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:REDIS.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDRESS:127.0.0.1:8848}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      # 上传大小限制（Spring Boot默认仅 max-file-size=1MB / max-request-size=10MB，大文件上传会被拒绝）
      max-file-size: 1024MB
      max-request-size: 2048MB
logging:
  level:
    com.alibaba: warn
    org.apache: warn

# 应用自定义配置
app:
  gateway:
    # 网关版本标识（/public/gateway/version 接口返回）
    # @project.version@ 由Maven资源过滤注入pom版本号（spring-boot-starter-parent默认对application*.yml开启过滤，IDE编译同样生效）
    # 可用启动参数覆盖，如：-DAPP_GATEWAY_VERSION=1.2.3-hotfix
    version: ${APP_GATEWAY_VERSION:@project.version@}
    # 视图路由分组配置（PublicGatewayVersionController使用）
    route-groups:
      - default
    enable-test-controller: pri

dubbo:
  application:
    name: dubbo-app-system-service
    logger: slf4j
    check-serializable: false
    serialize-check-status: DISABLE
  registry:
    address: nacos://${NACOS_ADDRESS:127.0.0.1:8848}
  shutdown:
    await-duration: 10000
  consumer:
    filter: -ContextHolderAuthenticationPrepareFilter
