tbs:
  web:
    permit-all-paths:
      - /public/**
    secured-paths:
      - /private/**
    auth:
      enable: true
      user-auth-service-impl: com.tbs.app.service.business.impl.SimpleUserAuthServiceImpl
    enable-cors: true
  swagger:
    base-package: com.tbs.app.controller
  system:
    main-delegate-invoker-impl: com.tbs.async.delegate.AsyncDelegateInvoker
    token-holder-impl: com.tbs.common.data.impl.MapDataHolder
    token-expire-impl: com.tbs.common.data.impl.LocalDataExpireActuator
  cache:
    cache-manager-implementation: com.tbs.cache.core.manager.holder.DataHolderCacheManager
    expired-actuator: com.tbs.cache.core.impl.LocalExpireActuatorCache
  boardcast:
    event-bus-type: com.tbs.boardcast.bus.impl.SimpleEventBus
  lock:
    lock-provider-type: com.tbs.lock.impls.providers.JdkLockProvider
# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  redis:
    password: '123456'
    host: localhost
    port: 6379
    timeout: 3000

