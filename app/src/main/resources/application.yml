tbs:
  web:
    permit-all-paths:
      - /public/**
    secured-paths:
      - /private/**
    auth:
      enable: true
      user-auth-service-impl: com.tbs.app.service.business.impl.SimpleUserAuthServiceImpl
    enable-cors: true
  swagger:
    base-package: com.tbs.app.controller
  system:
    main-delegate-invoker-impl: com.tbs.async.delegate.AsyncDelegateInvoker
    token-holder-impl: com.tbs.redis.holder.RedisDataHolder
  cache:
    cache-manager-implementation: org.springframework.data.redis.cache.RedisCacheManager
    expired-actuator: com.tbs.redis.cache.RedisCacheExpireActuatorCache
  boardcast:
    event-bus-type: com.tbs.redis.boradcast.SimpleRedisEventBus
# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  redis:
    password: '123456'
    host: localhost
    port: 6379
    timeout: 3000

