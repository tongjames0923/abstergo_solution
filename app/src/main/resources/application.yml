tbs:
  holder:
    main-context-holder-type: com.tbs.common.holder.impl.SpringManagedContextHolder
    use-thread-local-stored-context: true
  web:
    permit-all-paths:
      - /public/**
    secured-paths:
      - /private/**
    auth:
      enable: true
      user-auth-service-impl: com.tbs.app.service.business.impl.SimpleUserAuthServiceImpl
    enable-cors: true
  swagger:
    base-package: com.tbs.app.controller
logging:
  level:
    com.tbs: trace
# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid

