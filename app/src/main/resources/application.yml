tbs:
  web:
    permit-all-paths:
      - /public/**
    secured-paths:
      - /private/**
    auth:
      enable: true
      token-expire-time: 600
      token-issuance-center-impl: com.tbs.app.web.DefaultTokenSignCenter
    enable-cors: true
  swagger:
    base-package: com.tbs.app.controller
  system:
    main-delegate-invoker-impl: com.tbs.async.delegate.AsyncDelegateInvoker
    expire-actuator-class: com.tbs.redis.cache.RedisDataHolderExpireActuator
    enable: true
  cache:
    cache-manager-implementation: com.tbs.cache.core.manager.holder.DataHolderCacheManager
    expired-actuator: com.tbs.redis.cache.RedisCacheExpireActuator
  boardcast:
    event-bus-type: com.tbs.broadcast.bus.impl.SimpleEventBus
  lock:
    lock-provider-type: com.tbs.lock.impls.providers.JdkLockProvider
  data:
    data-holder-manager: com.tbs.common.data.impl.DefaultAutoGenDataHodlerManager
    data-holder: com.tbs.redis.holder.RedisDataHolder
  redis:
    enable: true
#  sql:
#    enable-log-interceptor: false
#    sql-logger-type: tbs.framework.sql.interfaces.impls.SimpleSqlLogger

# Spring配置
spring:
  application:
    name: app-service
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    generate-ddl: true
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://192.168.50.198:3306/app_system?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useUnicode=true&allowMultiQueries=true
    username: root
    password: '!Ty1997923'
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # 连接池名称
      pool-name: HikariCP
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接数
      maximum-pool-size: 20
      # 连接超时时间(毫秒)
      connection-timeout: 30000
      # 空闲连接超时时间(毫秒)
      idle-timeout: 600000
      # 连接最大存活时间(毫秒)
      max-lifetime: 1800000
      # 连接测试查询
      connection-test-query: SELECT 1
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  redis:
    password: '123456'
    host: localhost
    port: 6379
    timeout: 3000
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: admin123
    listener:
      direct:
        acknowledge-mode: manual
logging:
  level:
    com.tbs.schedule: debug
server:
  shutdown: graceful

mybatis:
  configuration:
    map-underscore-to-camel-case: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1  # 明确指定IP地址
