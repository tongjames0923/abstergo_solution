tbs:
  web:
    permit-all-paths:
      - /public/**
    secured-paths:
      - /private/**
    auth:
      enable: true
      token-expire-time: 600
      token-issuance-center-impl: com.tbs.app.web.DefaultTokenSignCenter
    enable-cors: true
  swagger:
    base-package: com.tbs.app.controller
  system:
    main-delegate-invoker-impl: com.tbs.async.delegate.AsyncDelegateInvoker
    expire-actuator-class: com.tbs.redis.cache.RedisDataHolderExpireActuator
    enable: true
  cache:
    cache-manager-implementation: com.tbs.cache.core.manager.holder.DataHolderCacheManager
    expired-actuator: com.tbs.redis.cache.RedisCacheExpireActuator
  boardcast:
    event-bus-type: com.tbs.broadcast.bus.impl.SimpleEventBus
  lock:
    lock-provider-type: com.tbs.lock.impls.providers.JdkLockProvider
  data:
    data-holder-manager: com.tbs.common.data.impl.DefaultAutoGenDataHodlerManager
    data-holder: com.tbs.redis.holder.RedisDataHolder
  redis:
    enable: true
  sql:
    enable-log-interceptor: true
    sql-logger-type: tbs.framework.sql.interfaces.impls.SimpleSqlLogger

# Spring配置
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  redis:
    password: '123456'
    host: localhost
    port: 6379
    timeout: 3000
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: admin123
    listener:
      direct:
        acknowledge-mode: manual
logging:
  level:
    com.tbs.schedule: debug
server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true

