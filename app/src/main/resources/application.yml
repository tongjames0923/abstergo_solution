# Spring配置
spring:
  profiles:
    include:
      - redis
      - db
      - tbs
      - mq
  application:
    name: app-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
logging:
  level:
    com.alibaba: warn
    org.apache: warn

dubbo:
  application:
    name: dubbo-app-system-service
    logger: slf4j
    check-serializable: false
    serialize-check-status: DISABLE
  registry:
    address: zookeeper://${ZOOKEEPER_ADDRESS:192.168.80.32:2181}
  protocol:
    port: ${DUBBO_PORT:20777}
    name: tri
  shutdown:
    await-duration: 10000
  consumer:
    filter: -ContextHolderAuthenticationPrepareFilter

