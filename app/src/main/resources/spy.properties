# P6Spy Configuration File
# Specify the real JDBC driver
driverlist=com.mysql.cj.jdbc.Driver
# Configure log output method
appender=com.p6spy.engine.spy.appender.Slf4JLogger
# Configure log message format
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=\n---[ Execution Time: %(executionTime) ms ]---\n---[ SQL:%(sqlSingleLine) ]---
# Date format
dateformat=yyyy-MM-dd HH:mm:ss
# Enable slow SQL detection
outagedetection=true
outagedetectioninterval=2
# Exclude some SQL statements (e.g. health checks)
exclude=select 1, select @@version, select @@version_comment
# Use p6spy driver as proxy
deregisterdrivers=true
# Set JDBC URL prefix
modulelist=com.p6spy.engine.logging.P6LogFactory
