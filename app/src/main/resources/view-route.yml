common:
  - path: /common
    component: Layout
    name: view.menu.common
    redirect: /common/user
    meta:
      routeGroup: default
      title: view.menu.common
      icon: el-icon-s-help
      roles:
        - "普通用户"
    children:
      - path: user
        name: view.menu.common.user
        component: "/user/index.vue"
        meta:
          routeGroup: default
          title: view.menu.common.user
          icon: el-icon-user
          roles:
            - "普通用户"

admin:
  - path: /admin
    component: Layout
    name: view.menu.admin.title
    redirect: /admin/user
    meta:
      routeGroup: default
      title: view.menu.admin.title
      icon: el-icon-s-help
      roles:
        - "超级管理员"
    children:
      - path: user
        name: view.menu.admin.user
        component: "/admin/user/index.vue"
        meta:
          routeGroup: default
          title: view.menu.admin.user
          icon: table
          roles:
            - "超级管理员"
      - path: role
        name: view.menu.admin.role
        component: "/admin/role/index.vue"
        meta:
          routeGroup: default
          title: view.menu.admin.role
          icon: eye
          roles:
            - "超级管理员"
      - path: company
        name: view.menu.admin.company
        component: "/admin/company/index.vue"
        meta:
          routeGroup: default
          title: view.menu.admin.company
          icon: el-icon-s-custom
          roles:
            - "超级管理员"
develop:
  - path: /develop
    component: Layout
    name: view.menu.develop
    redirect: /develop/form-manager
    meta:
      routeGroup: default
      title: view.menu.develop.title
      icon: el-icon-s-help
      roles:
        - "开发员"
        - "超级管理员"
    children:
      - path: cache
        name: view.menu.develop.cache
        component: "/cache/index.vue"
        meta:
          routeGroup: default
          title: view.menu.develop.cache
          icon: el-icon-s-data
          roles:
              - "开发员"
      - path: form-manager
        name: view.menu.develop.form.manager
        component: "/form/FormManager.vue"
        meta:
          routeGroup: default
          title: view.menu.develop.form.manager
          icon: el-icon-s-order
          roles:
            - "开发员"
      - path: form
        name: view.menu.develop.form.create
        component: "/form/FormCreator.vue"
        meta:
          routeGroup: default
          title: view.menu.develop.form.create
          icon: el-icon-s-custom
          roles:
            - "开发员"
      - path: systemlog
        name: view.menu.develop.systemlog
        component: "/admin/systemlog/index.vue"
        meta:
          routeGroup: default
          title: view.menu.develop.systemlog
          icon: el-icon-s-data
          roles:
            - "开发员"
            - "超级管理员"
      - path: dic
        name: view.menu.develop.dic
        component: "/admin/dic/index.vue"
        meta:
          routeGroup: default
          title: view.menu.develop.dic
          icon: el-icon-notebook-2
          roles:
            - "开发员"
            - "超级管理员"
      - path: generic-api
        name: view.menu.develop.generic.api
        component: "/admin/generic-api/index.vue"
        meta:
          routeGroup: default
          title: view.menu.develop.generic.api
          icon: el-icon-connection
          roles:
            - "开发员"
            - "超级管理员"

