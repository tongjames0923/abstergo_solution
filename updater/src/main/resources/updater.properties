# 更新器配置（GUI 演示用，classpath 下自动加载）
# 完整模板见 updater.properties.template

server.host=192.168.80.32
server.port=8082
server.checkPath=/public/app-update/check

app.appKey=XH-Backend-App
app.platform=windows
app.currentVersionCode=1

# local.downloadDir 不指定时默认为系统临时目录下的 updates（如 /tmp/updates、C:\Users\xxx\AppData\Local\Temp\updates）
# 如需自定义下载目录，取消下行注释并修改为实际路径
local.downloadDir=/Users/abstergo/Downloads

update.timeoutSeconds=30
update.tryAllUrls=true
