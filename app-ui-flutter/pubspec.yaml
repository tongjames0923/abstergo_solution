name: app_ui_flutter
description: "Abstergo Solution 多端 Flutter 客户端应用壳。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  forui: 0.25.0
  intl: ^0.20.0
  logging: ^1.2.0
  window_manager: ^0.4.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  tbs_client:
    path: ../sdk-flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shelf: ^1.4.0
  shelf_proxy: ^1.0.4
  shelf_static: ^1.1.2

flutter:
  generate: true
  uses-material-design: true
