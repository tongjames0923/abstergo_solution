# Spring配置
spring:
  profiles:
    include:
      - redis
      - db
      - tbs
      - mq
  application:
    name: logging-service
  # Nacos配置中心：从配置中心导入远程配置（optional前缀表示Nacos不可用时仍可本地启动）
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDRESS:127.0.0.1:8848}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
logging:
  level:
    com.alibaba: warn
    org.apache: warn

dubbo:
  application:
    name: dubbo-logging-view-service
    logger: slf4j
    check-serializable: false
    serialize-check-status: DISABLE
  registry:
    address: nacos://${NACOS_ADDRESS:127.0.0.1:8848}
  protocol:
    port: ${DUBBO_PORT:20780}
    name: tri
  shutdown:
    await-duration: 10000
  consumer:
    filter: -ContextHolderAuthenticationPrepareFilter
server:
  port: 8081
