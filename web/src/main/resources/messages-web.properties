#====================通用接口响应信息
GENERIC.API.ID_NOT_FOUND=通用接口ID不存在
GENERIC.API.NOT_LOGIN=调用需要有效登录
GENERIC.API.API_VERSION_NOT_FOUND=接口版本过低
# 以下两个键不拼接底层异常原文，真实原因作为 cause 进日志
GENERIC.API.DUBBO_INVOKE_FAILED=Dubbo泛化调用失败
GENERIC.API.TRIPLE_INVOKE_FAILED=Triple HTTP调用失败
# 新版泛化调用链路（/call/{apiId}、/meta/{apiId}）：类型与顺序只取登记值，不做任何猜测
GENERIC.API.REFERENCE_FAILED=泛化调用目标引用构建失败
# 远端方法自己抛出的异常：描述就是调用方需要看到的内容，直接透传（链路故障仍走 DUBBO_INVOKE_FAILED 不拼接原文）
GENERIC.API.REMOTE_BIZ_ERROR=远端服务执行异常：{0}
GENERIC.API.ENTRY_UNSUPPORTED=泛化API {0} 不支持该调用入口，请使用 /call 接口
GENERIC.API.RESULT_NOT_SERIALIZABLE=泛化调用返回值不可序列化: {0}
GENERIC.API.PARAM_DEF_MISSING=该泛化API未登记入参定义，不接受请求体参数
GENERIC.API.PARAM_REQUIRED=缺少必填参数 {0}
GENERIC.API.PARAM_UNKNOWN=未知参数 {0}
GENERIC.API.PARAM_COUNT_MISMATCH=入参个数不匹配：登记 {0} 个，传入 {1} 个
GENERIC.API.PARAM_NAME_UNREGISTERED=参数 {0} 未登记参数名，请改用按位置传参（JSON数组）
GENERIC.API.PARAM_TYPE_UNREGISTERED=参数 {0} 未登记参数类型，请先完成配置
GENERIC.API.BODY_FORMAT_UNSUPPORTED=泛化调用请求体只支持JSON对象或JSON数组
