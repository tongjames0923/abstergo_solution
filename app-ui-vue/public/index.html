<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= webpackConfig.name %></title>
    <style>
      /* 启动闪屏：随 HTML 即时渲染，覆盖 bundle 加载与 OAuth 回跳换票期间的白屏，Vue 挂载后自动替换 */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background-color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif;
        z-index: 9999;
      }

      .boot-spinner {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(0, 113, 227, 0.15);
        border-top-color: #0071e3;
        animation: boot-spin 0.9s linear infinite;
      }

      .boot-text {
        margin: 0;
        font-size: 14px;
        color: #1d1d1f;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= webpackConfig.name %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app">
      <div id="boot-splash">
        <span class="boot-spinner"></span>
        <p class="boot-text" id="boot-text">正在进入系统…</p>
      </div>
    </div>
    <script>
      (function () {
        var isZh = (navigator.language || '').toLowerCase().indexOf('zh') === 0
        document.getElementById('boot-text').textContent = isZh ? '正在进入系统…' : 'Entering the system…'
      })()
    </script>
    <!-- built files will be auto injected -->
  </body>
</html>
