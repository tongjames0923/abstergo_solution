worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # MIME类型配置
    # macOS (Homebrew): include /opt/homebrew/etc/nginx/mime.types;
    # Linux: include /etc/nginx/mime.types;
    # Windows: include mime.types;
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # gzip压缩配置
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    server {
        listen       8866;
        server_name  localhost;

        # ============================================
        # 请根据你的系统修改以下路径
        # ============================================

        # 前端静态文件服务
        # macOS: /Users/你的用户名/项目路径/app-ui-vue/dist
        # Windows: C:/Users/你的用户名/项目路径/app-ui-vue/dist (注意用正斜杠)
        # Linux: /home/你的用户名/项目路径/app-ui-vue/dist
        location / {
            root   /Users/abstergo/IdeaProjects/abstergo_solution_p/app-ui-vue/dist;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存策略
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root   /Users/abstergo/IdeaProjects/abstergo_solution_p/app-ui-vue/dist;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # API反向代理配置
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://127.0.0.1:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时配置
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # 错误页面配置
        error_page 404 /index.html;
        location = /404.html {
            root   /Users/abstergo/IdeaProjects/abstergo_solution_p/app-ui-vue/dist;
            internal;
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # 日志配置 - 根据系统修改路径
        # macOS: /opt/homebrew/var/log/nginx/
        # Linux: /var/log/nginx/
        # Windows: C:/nginx/logs/ 或 logs/
        access_log  /opt/homebrew/var/log/nginx/vue-app-access.log;
        error_log   /opt/homebrew/var/log/nginx/vue-app-error.log;
    }
}
