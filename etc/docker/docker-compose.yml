version: '3.8'
name: "app_system_core_env"
services:
  mysql:
    image: docker.1ms.run/library/mysql:8.4
    container_name: abstergo_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
  nacos:
    image: docker.1ms.run/nacos/nacos-server:v2.5.3
    container_name: abstergo_nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=123456
    depends_on:
      - mysql
    restart: always
  redis:
    image: docker.m.daocloud.io/library/redis:6.2.19
    container_name: abstergo_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    restart: always

  rabbitmq:
    image: docker.1ms.run/library/rabbitmq:3.10-management
    container_name: abstergo_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    restart: always


  xxl-job-admin:
    image: docker.1ms.run/xuxueli/xxl-job-admin:2.5.0
    container_name: xxl_job_admin
    environment:
      PARAMS: '--xxl.job.accessToken=123456789 --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=123456'
    ports:
      - "9898:8080"
    depends_on:
      - mysql
    restart: always

  dubbo-admin:
    image: docker.1ms.run/apache/dubbo-admin:0.6.0
    container_name: abstergo_dubbo_admin
    ports:
      - "9600:38080"
    environment:
      - admin.registry.address=nacos://nacos:8848
      - admin.config-center=nacos://nacos:8848
      - admin.metadata-report.address=nacos://nacos:8848
      - server.port= 38080
    depends_on:
      - nacos
    restart: always


volumes:
  mysql_data:
