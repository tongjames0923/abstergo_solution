version: '3.8'

services:
  redis:
    image: docker.m.daocloud.io/library/redis:6.2.19
    container_name: abstergo_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    restart: always

  rabbitmq:
    image: docker.m.daocloud.io/library/rabbitmq:3-management
    container_name: abstergo_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    restart: always

  zookeeper:
    image: docker.m.daocloud.io/library/zookeeper:latest
    container_name: abstergo_zookeeper
    ports:
      - "2181:2181"
      - "2888:2888"
      - "3888:3888"
      - "8989:8080"
    restart: always

  dubbo-admin:
    image: apache/dubbo-admin:latest
    container_name: abstergo_dubbo_admin
    ports:
      - "9600:38080"
    environment:
      - admin.registry.address=zookeeper://zookeeper:2181
      - admin.config-center=zookeeper://zookeeper:2181
      - admin.metadata-report.address=zookeeper://zookeeper:2181
      - server.port= 38080
    depends_on:
      - zookeeper
    restart: always

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: xxl_job_admin
    environment:
      PARAMS: '--xxl.job.accessToken=123456789 --spring.datasource.url=jdbc:mysql://192.168.50.198:3306/xxlJob?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=!Ty1997923'
    ports:
      - "9898:8080"
    restart: always
